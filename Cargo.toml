[package]
name = "xmip-core-transport-ethernet-ip"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-ethernet-ip"
description = "EtherNet/IP transport: ODVA encapsulation over TCP — RegisterSession, SendRRData with common packet format items, CIP explicit messaging that gets or sets an assembly attribute carrying the Stream. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { workspace = true }
# The one refusal of a size over a ceiling (`net::ceiling`).
net = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# The carrier, declared in architecture.toml: EtherNet/IP encapsulation rides on
# a TCP connection, so the tcp technology is the carrier. The code's alone:
# the declaration takes none of tcp's settings.
tcp = { workspace = true, optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:net", "dep:tcp"]
# The declaration alone, with the assembly instance a Location speaks about
# unless it names another.
declaration = []

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
